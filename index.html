const LEAD=10000;let wodTimerId=null,audioCtx=null,wakeLock=null,lastCue=null;
function fmtSec(sec){let n=Math.max(0,Math.floor(sec));return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`}
function parseClock(v){let t=String(v||'').trim();let m=t.match(/^(\d{1,3}):([0-5]\d)$/);if(m)return +m[1]*60+ +m[2];if(/^\d+([.,]\d+)?$/.test(t))return Math.round(parseFloat(t.replace(',','.'))*60);return null}

function wodStart(kind,di,manual){let p=getPlan(di);if(!isStrengthDay(p))return;let x=kind==='crossfit'?cfFor(p,di).w:finisherFor(p,di).f,min=kind==='crossfit'?x.min:finisherMinutes(x);S.wodRun={kind,day:di,week:S.week,key:p.key,id:x.id,name:x.name,format:x.format,min,moves:x.moves.slice(),scheme:x.scheme||'',legs:x.legs||0,started:null,pausedAt:null,paused:0,rounds:0,stopped:null,ended:!!manual,manual:!!manual,capped:false,rpe:8};S.tab='training';S.selectedDay=di;save();render();window.scrollTo?.(0,0)}

function wodClock(r){let cap=r.min*60000,e=wodElapsed(r);if(!r.started)return {main:r.format==='ForTime'?'0:00':r.format==='EMOM'?'1:00':fmtSec(r.min*60),sub:'Bereit · 10 s Vorlauf nach dem Start',station:r.format==='EMOM'?`Min. 1: ${r.moves[0]}`:'',pct:0,phase:'ready'};if(e<0)return {main:String(Math.ceil(-e/1000)),sub:'Gleich geht’s los',station:r.format==='EMOM'?`Min. 1: ${r.moves[0]}`:'',pct:0,phase:'lead'};let pct=Math.min(100,e/cap*100);if(r.format==='AMRAP')return {main:fmtSec(Math.ceil((cap-e)/1000)),sub:`${r.rounds} ${r.rounds===1?'Runde':'Runden'}`,station:'',pct,phase:'run'};if(r.format==='EMOM'){let m=Math.min(r.min-1,Math.floor(e/60000));return {main:fmtSec(Math.ceil((60000-(e-m*60000))/1000)),sub:`Minute ${m+1} / ${r.min}`,station:r.moves[m%r.moves.length],pct,phase:'run',minute:m}}return {main:fmtSec(e/1000),sub:`Time Cap ${r.min}:00`,station:'',pct,phase:'run'}}
function wodTick(){let r=S.wodRun,el=document.getElementById('wodClock');if(!r||!el){clearInterval(wodTimerId);wodTimerId=null;return}if(wodSync()){beep(660,700);render();return}let c=wodClock(r),set=(id,v)=>{let n=document.getElementById(id);if(n&&n.textContent!==v)n.textContent=v};set('wodClock',c.main);el.classList.toggle('lead',c.phase==='lead');set('wodSub',c.sub);set('wodStation',c.station);let bar=document.getElementById('wodBar');if(bar)bar.style.width=c.pct+'%';let e=wodElapsed(r),cue=null;if(e<0&&e>-3500)cue='l'+Math.ceil(-e/1000);else if(e>=0&&e<1000)cue='go';else if(r.format==='EMOM'&&c.minute>0&&e-c.minute*60000<1000)cue='m'+c.minute;else if(r.min*60000-e<3500)cue='e'+Math.ceil((r.min*60000-e)/1000);if(cue&&cue!==lastCue){lastCue=cue;if(cue==='go'||cue[0]==='m'){beep(988,350);let card=document.getElementById('wodCard');if(card){card.classList.remove('flash');void card.offsetWidth;card.classList.add('flash')}}else beep(660,120)}}
function wodResultView(r){let e=r.manual?0:Math.max(0,wodElapsed(r)),fields='';if(r.format==='AMRAP')fields=`<div><label for="wodRounds">Runden</label><input id="wodRounds" type="number" min="0" inputmode="numeric" value="${r.rounds||''}"></div><div><label for="wodReps">+ Wiederholungen</label><input id="wodReps" type="number" min="0" inputmode="numeric" placeholder="0"></div>`;else if(r.format==='EMOM')fields=`<div><label for="wodRounds">Minuten sauber geschafft</label><input id="wodRounds" type="number" min="0" max="${r.min}" inputmode="numeric" value="${r.manual?r.min:Math.min(r.min,Math.floor(e/60000))}"></div>`;else fields=`<div><label for="wodTime">Zeit (mm:ss)</label><input id="wodTime" inputmode="numeric" placeholder="8:34" value="${!r.manual&&!r.capped?fmtSec(e/1000):''}"></div><div><label for="wodReps">Wdh. bei Time Cap</label><input id="wodReps" type="number" min="0" inputmode="numeric" placeholder="—"></div><div class="span2"><label class="check-line"><input id="wodCapped" type="checkbox" ${r.capped?'checked':''}> Time Cap erreicht</label></div>`;return `<div class="card"><span class="pill ${r.kind==='crossfit'?'tag-cf':''}">${r.manual?'Ergebnis eintragen':r.capped?'Time Cap erreicht':'Geschafft'}</span><h2 style="margin:10px 0 4px">${esc(r.name)}</h2><div class="small muted">${fmtLabel(r,r.min)}${r.manual?'':` · gestoppt bei ${fmtSec(e/1000)}`}</div><div class="formgrid" style="margin-top:14px">${fields}${r.kind==='crossfit'?`<div><label for="wodTotal">Gesamtdauer (Min.)</label><input id="wodTotal" type="number" min="1" inputmode="numeric" value="${27+r.min}"><div class="tiny muted" style="margin-top:4px">inkl. Warm-up und Skill</div></div>`:''}<div class="span2"><label for="wodNote">Notiz (optional)</label><input id="wodNote" maxlength="200" placeholder="z. B. 16-kg-KB, Ring Rows"></div></div><div style="margin-top:14px"><span class="small muted">Anstrengung (RPE)</span><div class="rpe-row" role="group" aria-label="RPE wählen">${[6,7,8,9,10].map(n=>`<button class="chip ${(r.rpe||8)===n?'selected':''}" data-wod-rpe="${n}" aria-pressed="${(r.rpe||8)===n}">${n}</button>`).join('')}</div></div><div class="actions"><button class="primary" data-wod-save>Ergebnis speichern</button><button class="outline" data-wod-exit>Verwerfen</button></div></div>`}
function wodRunView(){let r=S.wodRun;if(!r)return '';wodSync();let head=`<div class="row wod-top"><button class="outline" data-wod-exit>${r.ended?'Verwerfen':'Abbrechen'}</button><span class="pill ${r.kind==='crossfit'?'tag-cf':''}">${r.kind==='crossfit'?'CrossFit':'Finisher'} · ${fmtShort(r)}</span></div><div class="small muted center" style="margin-top:8px">${esc(r.name)}</div>`;if(r.ended)return `<section class="section">${head}${wodResultView(r)}</section>`;let c=wodClock(r),running=!!r.started&&!r.pausedAt,pause=`<button class="outline" data-wod-pause>${r.pausedAt?'Fortsetzen':'Pause'}</button>`,controls=!r.started?`<button class="primary round-btn" data-wod-go>Start</button><p class="tiny muted center">10 s Vorlauf · Signalton zum Start</p>`:r.format==='AMRAP'?`<button class="primary round-btn" data-wod-round ${running?'':'disabled'}>+1 Runde</button><div class="actions"><button class="outline" data-wod-unround ${r.rounds?'':'disabled'}>−1 Runde</button>${pause}<button class="outline" data-wod-end>Beenden</button></div>`:r.format==='ForTime'?`<button class="primary round-btn" data-wod-stop>Fertig · Zeit stoppen</button><div class="actions">${pause}</div>`:`<div class="actions">${pause}<button class="outline" data-wod-end>Beenden</button></div>`;return `<section class="section">${head}<div class="card clock-card ${r.kind==='crossfit'?'cf':''}" id="wodCard"><div class="small muted">${fmtLabel(r,r.min)}${r.scheme?' · '+esc(r.scheme):''}</div><div class="clock ${c.phase==='lead'?'lead':''}" id="wodClock" role="timer" aria-label="WOD-Uhr">${c.main}</div><div class="wod-sub" id="wodSub" aria-live="polite">${esc(c.sub)}</div><div class="station" id="wodStation">${esc(c.station)}</div><div class="bar" style="margin-top:14px"><i id="wodBar" style="width:${c.pct}%"></i></div>${r.pausedAt?'<div class="pill" style="margin-top:12px">Pausiert</div>':''}</div>${controls}<div class="card"><b>Ablauf</b>${moveList(r)}</div><p class="tiny muted">Signaltöne beim Start${r.format==='EMOM'?', zu jeder neuen Minute':''} und kurz vor Schluss. Bei stummgeschaltetem iPhone sind sie evtl. nicht hörbar – die Uhr läuft trotzdem weiter.</p></section>`}
function wodSave(vals){let r=S.wodRun;if(!r)return 'Kein WOD aktiv.';vals=vals||{};let e=r.manual?null:Math.max(0,wodElapsed(r)),wodMin=r.manual?r.min:Math.max(1,Math.round(e/60000)),result='';if(r.format==='AMRAP'){let rd=Math.max(0,parseInt(vals.rounds)||0),rp=Math.max(0,parseInt(vals.reps)||0);result=`${rd} Runden${rp?` + ${rp} Wdh.`:''}`}else if(r.format==='EMOM'){let rd=Math.min(r.min,Math.max(0,parseInt(vals.rounds)||0));result=`${rd}/${r.min} Minuten sauber`}else if(vals.capped){result=`Time Cap · ${Math.max(0,parseInt(vals.reps)||0)} Wdh.`;wodMin=r.min}else{let t=parseClock(vals.time);if(t===null||t<=0)return 'Zeit bitte als mm:ss eingeben, z. B. 8:34.';result=fmtSec(t);wodMin=Math.max(1,Math.round(t/60))}let rpe=r.rpe||8,effort=rpe<=6?'light':rpe>=9?'hard':'normal',duration=r.kind==='crossfit'?Math.max(wodMin,parseInt(vals.total)||wodMin):wodMin,load=Math.round(duration*(S.loadFactors?.[effort]??.7)*10)/10;S.logs.push({type:r.kind==='crossfit'?'crossfit':'metcon',name:`${r.kind==='crossfit'?'CrossFit':'Finisher'} · ${r.name}`,key:r.key,week:r.week,day:r.day,date:today(),duration,load,effort,rpe,format:r.format,result,wodId:r.id,legs:r.legs,note:String(vals.note||'').slice(0,200)});if(r.kind==='crossfit')S.completed[`${r.week}-${r.day}`]=true;let kind=r.kind;S.wodRun=null;clearInterval(wodTimerId);save();keepAwake(false);render();toast(kind==='crossfit'?`WOD gespeichert · ${result}`:`Finisher gespeichert · ${result}`);return ''}
function bindWod(){let r=S.wodRun;if(!r)return;let q=s=>document.querySelector(s);q('[data-wod-go]')?.addEventListener('click',()=>{beep(440,40);r.started=Date.now()+LEAD;r.pausedAt=null;r.paused=0;lastCue=null;save();keepAwake(true);render()});q('[data-wod-pause]')?.addEventListener('click',()=>{if(r.pausedAt){r.paused+=Date.now()-r.pausedAt;r.pausedAt=null;keepAwake(true)}else r.pausedAt=Date.now();save();render()});q('[data-wod-round]')?.addEventListener('click',()=>{r.rounds++;save();render()});q('[data-wod-unround]')?.addEventListener('click',()=>{r.rounds=Math.max(0,r.rounds-1);save();render()});q('[data-wod-stop]')?.addEventListener('click',()=>{if(wodElapsed(r)<0){toast('Der Vorlauf läuft noch.');return}r.stopped=r.pausedAt||Date.now();r.ended=true;r.capped=false;save();keepAwake(false);beep(660,500);render()});q('[data-wod-end]')?.addEventListener('click',()=>{if(!confirm('Vorzeitig beenden und Ergebnis eintragen?'))return;r.stopped=r.pausedAt||Date.now();r.ended=true;save();keepAwake(false);render()});document.querySelectorAll('[data-wod-exit]').forEach(b=>b.onclick=()=>{if(!confirm(r.ended?'Ergebnis verwerfen? Es wird nichts gespeichert.':'WOD abbrechen? Es wird nichts gespeichert.'))return;S.wodRun=null;clearInterval(wodTimerId);keepAwake(false);save();render()});document.querySelectorAll('[data-wod-rpe]').forEach(b=>b.onclick=()=>{r.rpe=+b.dataset.wodRpe;save();document.querySelectorAll('[data-wod-rpe]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))})});q('[data-wod-save]')?.addEventListener('click',()=>{let v=id=>document.getElementById(id)?.value,err=wodSave({rounds:v('wodRounds'),reps:v('wodReps'),time:v('wodTime'),total:v('wodTotal'),note:v('wodNote'),capped:!!document.getElementById('wodCapped')?.checked});if(err)toast(err)});clearInterval(wodTimerId);wodTimerId=null;if(r.started&&!r.ended&&!r.pausedAt)wodTimerId=setInterval(wodTick,250)}
document.addEventListener('visibilitychange',()=>{let r=S.wodRun;if(document.visibilityState==='visible'&&r&&r.started&&!r.ended&&!r.pausedAt){keepAwake(true);if(wodSync())render()}});
function collision(order){let problems=[];for(let d=0;d<7;d++){let a=PLAN[order[d]],b=PLAN[order[(d+1)%7]];if(a.legs&&b.hard)problems.push({type:'Kollision',days:[d,(d+1)%7],text:`${DAYS[d]} schwere Beine direkt vor ${DAYS[(d+1)%7]} hartem Lauf`});if(a.hard&&b.legs)problems.push({type:'Hinweis',days:[d,(d+1)%7],text:`${DAYS[d]} harter Lauf direkt vor ${DAYS[(d+1)%7]} Beinen`});if(a.hard&&b.hard)problems.push({type:'Kollision',days:[d,(d+1)%7],text:'Zwei harte Läufe direkt hintereinander'});if(a.legs&&b.legs)problems.push({type:'Hinweis',days:[d,(d+1)%7],text:'Zwei Beintage direkt hintereinander'})}return problems}
function nav(){return `<nav class="tabs" aria-label="Hauptnavigation">${[['programm','⌂','Programm'],['training','▶','Training'],['verlauf','↗','Verlauf'],['analyse','◒','Analyse'],['setup','⚙','Setup']].map(([id,ico,label])=>`<button class="tab ${S.tab===id?'active':''}" data-tab="${id}" aria-label="${label}" aria-current="${S.tab===id?'page':'false'}"><span class="ico">${ico}</span>${label}</button>`).join('')}</nav>`}
function header(){return `<header id="top" class="top"><div class="eyebrow"><span class="top-brand"><img src="icon-180.png" alt="">HYBRID/WK</span>　·　WOCHE ${S.week}　·　${block().toUpperCase()}</div><div class="title">${({programm:'Programm',training:'Training',verlauf:'Verlauf',analyse:'Analyse',setup:'Setup'})[S.tab]}</div>${S.session||S.tri?.active||S.wodRun?'':nav()}</header>`}
function render(){let body=S.tri?.active?triRunView():S.session?sessionView():S.wodRun?wodRunView():({programm:program,training:training,verlauf:history,analyse:analysis,setup:setup}[S.tab]||program)();document.getElementById('app').innerHTML=header()+`<main class="content">${body}</main><div id="toast" class="hidden" role="status" style="position:fixed;z-index:12;bottom:24px;left:50%;transform:translateX(-50%);background:var(--raised);padding:12px 18px;border-radius:14px;box-shadow:0 4px 30px #000"> </div>`;bind();if(S.session)bindSession();if(S.tri?.active)bindTri();if(S.wodRun&&!S.session&&!S.tri?.active)bindWod();}
function weekOverview(){let order=weekOrder();return `<div class="list">${order.map((pi,day)=>{let p=PLAN[pi],done=S.completed[`${S.week}-${day}`],cf=isStrengthDay(p)&&S.dayMode?.[`${S.week}-${day}`]==='crossfit',desc=p.run?runDescription(p.run):p.key==='rehab'?'Recovery-Rituale · kein Workout':p.key==='rest'?'Erholung':`${mainSets()[0]} × ${mainSets()[1]} Hauptlift · ${auxSets()} Zusatzsätze`;if(cf)desc=`statt ${shortName(p)}${p.run?' · '+runDescription(p.run):''}`;else if(isStrengthDay(p)&&S.week!==16)desc+=' · + Finisher';return `<div class="listrow"><button class="subtle" data-day="${day}" aria-label="${DAYS[day]} ansehen" style="min-width:42px">${DAYS[day]}</button><div class="grow"><b>${cf?`<span class="ember">CrossFit</span> · ${esc(cfFor(p,day).w.name)}`:esc(p.name)}</b><div class="small muted">${esc(desc)}${p.run?` · ${targetPace(p.run)}/km`:''}</div></div><button class="check ${done?'done':''}" data-done="${day}" aria-label="Einheit ${done?'erledigt':'offen'}">${done?'✓':'○'}</button></div>`}).join('')}</div>`}
function smallestSafeSwap(order){let base=collision(order),baseHard=base.filter(x=>x.type==='Kollision').length,baseHints=base.filter(x=>x.type==='Hinweis').length,best=null;for(let i=dow();i<7;i++)for(let j=i+1;j<7;j++){if(i===6||j===6||order[i]===6||order[j]===6||S.completed[`${S.week}-${i}`]||S.completed[`${S.week}-${j}`])continue;let next=[...order];[next[i],next[j]]=[next[j],next[i]];let c=collision(next),hard=c.filter(x=>x.type==='Kollision').length,hints=c.filter(x=>x.type==='Hinweis').length;if(hard<baseHard||(hard===baseHard&&hints<baseHints)){let score=hard*10+hints;if(!best||score<best.score)best={from:i,to:j,score,hard,hints}}}return best}
function program(){let order=weekOrder(),c=collision(order),fix=smallestSafeSwap(order);let cHtml=c.length?c.map(x=>`<div class="small ${x.type==='Kollision'?'ember':'muted'}">${x.type==='Kollision'?'⚠':'·'} ${x.text}</div>`).join(''):'<span class="pill">Keine Kollisionen im Plan</span>';let open=S.logs.some(l=>l.date===today());return `<section class="hero"><div class="hero-kicker"><span class="hero-dot"></span>HYBRID / WK · 16-WOCHEN-SYSTEM</div><h1>Train with<em>intent.</em></h1><p>Kraft und Ausdauer, im eigenen Rhythmus – mit Erholung fest im Plan.</p><button class="primary hero-cta" data-go="training">Heutigen Tag öffnen <span aria-hidden="true">↗</span></button><div class="hero-state"><span>AKTUELLER BLOCK</span><b>${block()} · WOCHE ${S.week} / 16</b></div></section><section class="section"><h2>Kraft oder CrossFit?</h2>${todayChoice()}</section><section class="section"><div class="grid"><div class="metric"><span class="muted">Block</span><b>${block()}</b></div><div class="metric"><span class="muted">Ziel-RPE</span><b>${wk().rpe[wi()]}</b></div><div class="metric"><span class="muted">Easy Run</span><b>${wk().easy[wi()]} km</b></div><div class="metric"><span class="muted">Long Run</span><b>${wk().long[wi()]} km</b></div></div><div class="card"><div class="row"><b>Wochencheck</b><span class="pill">${c.length?c.length+' Hinweis(e)':'Plan geprüft'}</span></div><div style="margin-top:10px">${cHtml}</div>${fix&&c.some(x=>x.type==='Kollision')?`<div class="small muted" style="margin-top:8px">Kleinster Tausch, der mindestens eine Kollision entfernt: ${DAYS[fix.from]} ↔ ${DAYS[fix.to]}.</div><button class="outline" data-best-swap="${fix.from},${fix.to}" style="margin-top:8px">Vorschlag übernehmen</button>`:''}<div class="actions"><button class="outline" data-move-current>Einheit verschieben</button><button class="outline" data-weekfinish>Woche abschließen</button></div></div></section><section class="section"><h2>Wochenplan</h2>${weekOverview()}</section>${open?'':`<section class="section"><div class="card"><div class="row"><div><b>Noch offen?</b><div class="small muted">Einheit nachtragen oder Ruhetag markieren.</div></div><button class="outline" data-go="analyse">Prüfen</button></div></div></section>`}<section class="section"><h2>Lean bleiben</h2><div class="card small">Protein zuerst: 1,6–2,2 g/kg${S.bodyweight?` (bei ${S.bodyweight} kg: ${(S.bodyweight*1.6).toFixed(0)}–${(S.bodyweight*2.2).toFixed(0)} g/Tag)`:''}. Kohlenhydrate um das Training. Kleines Defizit statt Crash; dauerhaft zu wenig Energie kann Leistung und Gesundheit beeinträchtigen. Schlaf 7–9 Stunden. Wenn Aussehen oder Essen dein Training bestimmen, sprich mit ärztlicher Fachperson. Bei Brustschmerz, Schwindel oder Puls, der nicht runtergeht: bitte abklären lassen.</div></section><section class="section"><h2>Routine & Gesundheit</h2>${routinePanel()}</section><section class="section"><h2>Mahlzeiten heute</h2>${mealPanel()}</section>`}
function mealPanel(){S.meals=S.meals||{};let eaten=S.meals[today()]||{};return `<div class="card tight">${['Frühstück','Mittagessen','Abendessen'].map((name,i)=>`<div class="listrow"><span>${name}</span><button class="check ${eaten[i]?'done':''}" data-meal="${i}">${eaten[i]?'✓':'○'}</button></div>`).join('')}<p class="tiny muted">Nur abhaken – keine Kalorien oder Ernährungswerte geschätzt.</p></div>`}
function routinePanel(recovery=false){let t=today(),r=S.routine[t]||[],items=['Tageslicht','Wasser','Protein','Schritte','Hautpflege','Bildschirm aus','Feste Schlafenszeit','Zähne'];if(S.creatine)items.push('Kreatin eingenommen');if(S.caffeine&&!recovery)items.push('Koffein vor Training');let sleep=S.sleep.filter(x=>x.date>=dateAgo(6)).map(x=>x.hours);let avg=sleep.length?(sleep.reduce((a,b)=>a+b,0)/sleep.length).toFixed(1):'—';return `<div class="card tight"><div class="row"><b>${r.length}/${items.length} erledigt</b><span class="pill">Serie ${routineStreak()} Tage</span></div>${items.map((x,i)=>`<div class="listrow"><span class="small">${x}</span><button class="check ${r.includes(i)?'done':''}" data-routine="${i}">${r.includes(i)?'✓':'○'}</button></div>`).join('')}<div class="formgrid" style="padding:12px 4px 3px"><div><label>Schlaf letzte Nacht (Std.)</label><input id="sleepValue" type="number" min="0" max="16" step="0.1" value="${S.sleep.find(x=>x.date===t)?.hours??''}"></div><div><label>7-Tage-Schnitt</label><div class="metric"><b>${avg}</b><span class="small muted">Stunden</span></div></div></div><button class="primary" data-save-sleep style="margin:8px 4px 2px">Schlaf speichern</button></div>`}
function dateAgo(days){let d=new Date();d.setDate(d.getDate()-days);return dateKey(d)}function routineStreak(){let n=0,d=new Date(),todayPoints=(S.routine[today()]||[]).length;if(todayPoints<5)d.setDate(d.getDate()-1);for(let i=0;i<366;i++){let k=dateKey(d);if((S.routine[k]||[]).length<5)break;n++;d.setDate(d.getDate()-1)}return n}
function workoutDesc(day){let p=getPlan(day);if(!p)return '—';if(p.run)return runDescription(p.run);return p.name}
function rehabView(di){S.rehab=S.rehab||{};let st=S.rehab[today()]||{},tasks=[['walk','Locker spazieren oder kurz bewegen'],['mobility','Sanfte Mobilität nach Gefühl'],['mealPrep','Mahlzeiten für morgen grob planen'],['sleepPlan','Schlafenszeit für heute festlegen']];return `<section class="section"><div class="card"><span class="pill">${DAYS[di]} · REHAB & RECOVERY</span><div class="big" style="margin:12px 0">Reset statt Training</div><p class="muted">Sonntag ist trainingsfrei: kein Krafttraining, Lauf oder WOD. Das ist allgemeine Regeneration, kein Behandlungsplan für Verletzungen.</p><div class="small muted">Rituale sind Vorschläge, keine Pflicht oder Punktzahl. Lass weg, was sich nicht gut anfühlt.</div></div><h2>Sanfter Reset</h2><div class="list">${tasks.map(([k,label])=>`<div class="listrow"><span class="grow">${label}</span><button class="check ${st[k]?'done':''}" data-rehab="${k}" aria-label="${label}">${st[k]?'✓':'○'}</button></div>`).join('')}</div><div class="card"><b>Bewegung ohne Zusatzbelastung</b><p class="small muted">Optionaler Spaziergang in Plaudertempo oder ein paar Minuten angenehme, schmerzfreie Beweglichkeit. Nicht in Schmerz hinein dehnen; bei zunehmenden Beschwerden abbrechen. Kein Ersatz für Physio oder medizinische Abklärung.</p></div><div class="card"><b>Essen & Trinken</b><p class="small muted">Normale, ausgewogene Mahlzeiten mit einer Proteinquelle und Kohlenhydraten; kein spezielles „Recovery-Food“ nötig. Trink normal nach Durst und ersetze deutliche Schweißverluste – keine erzwungenen Trinkmengen. Für Trainierende sind Gesamtzufuhr und regelmäßige Proteinquellen wichtiger als ein spezielles Timing.</p></div><div class="card"><b>Sauna – nur optional</b><p class="small muted">Kein notwendiger Recovery-Schritt; die Leistungs- und Erholungsbelege sind begrenzt. Wenn du Sauna gewohnt bist und dich gesund fühlst, bleib bei einer kurzen, vertrauten Runde. Geh raus, wenn dir schwindelig, übel oder ungewöhnlich schwach wird. Auslassen bei Kra ackupfile')?.addEventListener('change',importBackup);document.querySelector('[data-wipe]')?.addEventListener('click',()=>{if(confirm('Alle lokal gespeicherten Trainingsdaten wirklich löschen?')){S=fresh();save();render()}});document.querySelectorAll('[data-edit-log]').forEach(b=>b.onclick=()=>openEditLog(+b.dataset.editLog));document.querySelectorAll('[data-delete-log]').forEach(b=>b.onclick=()=>{let i=+b.dataset.deleteLog;if(confirm('Eintrag löschen?')){S.logs.splice(i,1);save();render()}});document.querySelector('[data-add-manual]')?.addEventListener('click',()=>{let date=document.getElementById('manualDate').value||today(),type=document.getElementById('manualType').value,dur=+document.getElementById('manualDuration').value,dist=+document.getElementById('manualDistance').value,effort=document.getElementById('manualEffort')?.value||'normal';if(!dur){toast('Dauer fehlt.');return}let pace=type==='run'&&dist?dur*60/dist:0,log={type,name:'Nachgetragen',date,duration:dur,distance:dist||0,pace,load:type==='run'&&pace?dur*(paceToSec(S.pace)/pace)**2:dur*(S.loadFactors?.[effort]??.7),effort};let added=saveLog(log);save();render();toast(added?'Einheit nachgetragen':'Dubletten-Eintrag übersprungen')});document.querySelector('[data-csv]')?.addEventListener('click',()=>document.getElementById('csvfile').click());document.querySelector('#csvfile')?.addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let arr=csvParse(r.result),n=0;arr.forEach(x=>{if(saveLog(x))n++});save();render();toast(`${n} Einheiten importiert`)};r.readAsText(f)});document.querySelectorAll('[data-restday]').forEach(b=>b.onclick=()=>{let d=b.dataset.restday;if(S.logs.some(l=>l.date===d))return;S.logs.push({type:'rest',name:'Ruhetag markiert',date:d,duration:0,load:0});S.restDays=S.restDays||[];S.restDays.push(d);save();render();toast('Ruhetag markiert')});document.querySelectorAll('[data-math]').forEach(b=>b.onclick=()=>{let key=b.dataset.math,log=S.logs.slice().reverse().find(x=>x.type!=='rest'),series=dailySeries(42),loads=series.filter(x=>x.load!==null).map(x=>x.load),detail=key==='load'&&log?.type==='run'?`Lauf: Last = Dauer × (Lockertempo / Laufpace)². Deine Werte: ${log.duration} min × (${S.pace} / ${secToPace(log.pace)})² = ${Math.round(activityLoad(log))}.`:key==='load'?`Nichtlauf: Last = Dauer × Gewichtung je Minute. Dauer ${log?.duration||0} min, Anstrengung ${log?.effort||'normal'}, Faktor ${S.loadFactors?.[log?.effort||'normal']??.7}.`:key==='anchor'?`95. Perzentil der protokollierten Tageslasten der letzten 42 Tage, mindestens 40. Datenpunkte: ${loads.length}; Anker ${Math.round(Math.max(40,percentile(loads,.95)))}.`:`EWMA: neuer Wert = α × Tageslast + (1 − α) × vorheriger Wert; α = 2 / (N + 1). ${key==='fitness'?'N=42':'N=7'} protokollierte Tage im Kalenderfenster. Fehlende Aufzeichnungstage werden separat gezählt und nicht als Ruhetage eingeordnet.`;openSheet(`<h2 class="sheet-title">Rechenweg: ${esc(key)}</h2><p class="small muted">${esc(detail)}</p><p class="tiny muted">Nur deine gespeicherten Werte und die sichtbaren Planparameter gehen ein.</p><button class="outline" data-close>Schließen</button>`)})}
