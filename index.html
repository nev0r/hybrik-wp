(function(){
const nn=v=>{const n=parseFloat(String(v==null?"":v).replace(",",".")); return isFinite(n)?n:0;};
const lk=d=>new Date(d).toLocaleDateString("sv-SE");                 // lokales Datum YYYY-MM-DD
const at=k=>{const p=k.split("-").map(Number); return new Date(p[0],p[1]-1,p[2],12,0,0).toISOString();};
const WD=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const KEYS=["sun","mon","tue","wed","thu","fri","sat"];
const RD=()=>S.restDays||(S.restDays={});
const KINDS=[["run","Lauf"],["kraft","Kraft"],["rad","Rad"],["sonst","Anderes"]];
const EFF=[["leicht",0.8],["gut",1],["schwer",1.25]];
const mk=(t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
const chev=()=>typeof CHEV!=="undefined"?CHEV:"";
const monday=()=>{const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return lk(d);};
const firstKey=()=>{
  let m=S.since||null;
  S.history.forEach(h=>{const k=lk(h.date); if(!m||k<m) m=k;});
  return m;
};
const fmtDay=d=>new Date(d).toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"short"});

/* ---------- Was fehlt noch? ---------- */
function missed(){
  if(!S.since){ S.since=lk(new Date()); save(); }
  const out=[];
  for(let i=1;i<=3;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const k=lk(d);
    if(k<S.since||RD()[k]) continue;
    const key=KEYS[d.getDay()], D=buildDay(key);
    const es=S.history.filter(h=>lk(h.date)===k);
    const need=[];
    if(D.ex&&D.ex.length&&!es.some(h=>!h.run)) need.push({kind:"kraft",label:D.title});
    if(D.run&&!es.some(h=>h.run)) need.push({kind:"run",label:D.run.label,km:D.run.km});
    if(D.free){
      const f=S.freeDay;
      if(f&&(f.mode==="kraft"||f.mode==="ausdauer")&&!f.done&&!es.length)
        need.push({kind:f.mode==="kraft"?"kraft":"sonst",label:"Freier Tag"});
    }
    if(need.length) out.push({k,d,key,need});
  }
  return out;
}

/* ---------- Fortschritt der Woche mitziehen ---------- */
function tickPlan(rec,k,dayKey,min){
  if(k<monday()||k>lk(new Date())) return;
  const D=buildDay(dayKey);
  if(rec.kind==="run"&&D.run&&!S.runs[dayKey]) S.runs[dayKey]={km:rec.run.km,min:min};
  if(rec.kind==="kraft"&&D.ex&&D.ex.length&&!liftStarted(D)){
    D.ex.forEach((ex,i)=>{
      for(let s=1;s<=ex.sets;s++){
        const id=sKey(D.key,i,s);
        if(!S.sets[id]) S.sets[id]={kg:ex.target||0,reps:parseInt(String(ex.reps),10)||0,assumed:true};
      }
    });
  }
}
function rebuildBest(){
  S.best={};
  S.history.forEach(h=>(h.ex||[]).forEach(e=>(e.sets||[]).forEach(s=>{
    const v=e1rm(s.kg,s.reps);
    if(v>0&&(!S.best[e.n]||v>S.best[e.n].e1rm)) S.best[e.n]={e1rm:v,kg:s.kg,reps:s.reps,date:h.date};
  })));
}

/* ---------- Eintrag anlegen oder ändern ---------- */
function entrySheet(init,idx){
  const edit=idx!=null, h=edit?S.history[idx]:null;
  const hasEx=!!(edit&&h.ex&&h.ex.length);
  const E=edit
    ? {k:lk(h.date),kind:h.kind||(h.run?"run":"kraft"),label:h.label||"",min:h.dur?Math.round(h.dur/60):"",km:h.run?h.run.km:"",eff:h.eff||1}
    : Object.assign({k:lk(new Date()),kind:"kraft",label:"",min:"",km:"",eff:1},init||{});
  let err="";
  const lab=t=>{const d=mk("div","sect",t); d.style.padding="14px 4px 7px"; return d;};

  const commit=()=>{
    const min=Math.round(nn(E.min)), km=nn(E.km);
    if(!(min>0)){ err="Trag die Dauer in Minuten ein."; draw(); return; }
    if(E.kind==="run"&&!(km>0)){ err="Trag die Strecke in Kilometern ein."; draw(); return; }
    if(!edit&&E.kind==="run"&&S.history.some(x=>x.run&&lk(x.date)===E.k&&Math.abs(x.run.km-km)<0.4)){
      if(!confirm("An dem Tag gibt es schon einen Lauf mit ähnlicher Strecke. Trotzdem speichern?")) return;
    }
    const date=at(E.k), dayKey=KEYS[new Date(date).getDay()];
    const name=(E.label||"").trim()||(E.kind==="run"?"Lauf":E.kind==="kraft"?"Kraft":E.kind==="rad"?"Rad":"Training");
    const rec=edit?h:{ex:[],src:"manual",week:S.week};
    Object.assign(rec,{date,day:dayKey,label:name,dur:min*60,kind:E.kind,eff:E.eff});
    if(E.kind==="run") rec.run={km:+km.toFixed(2),min}; else delete rec.run;
    if(!edit) S.history.push(rec);
    S.history.sort((a,b)=>new Date(a.date)-new Date(b.date));
    delete RD()[E.k];
    tickPlan(rec,E.k,dayKey,min);
    S.flash=(edit?"Eintrag geändert: ":"Nachgetragen: ")+name+" · "+fmtDay(date);
    save(); closeSheet(); renderAll();
  };
  const remove=()=>{
    if(!confirm("Diesen Eintrag löschen?")) return;
    const x=S.history[idx];
    if(x.run&&S.runs[x.day]&&S.runs[x.day].km===x.run.km&&S.runs[x.day].min===x.run.min) delete S.runs[x.day];
    if(x.free&&S.freeDay) S.freeDay.done=false;
    S.history.splice(idx,1);
    if(x.ex&&x.ex.length) rebuildBest();
    save(); closeSheet(); renderAll();
  };

  function draw(){
    openSheet(p=>{
      p.appendChild(mk("div","sheet-h",edit?"Einheit bearbeiten":"Einheit nachtragen"));
      p.appendChild(mk("div","sheet-s",edit
        ? "Datum, Dauer und Strecke lassen sich korrigieren."+(hasEx?" Die Sätze bleiben unverändert.":"")
        : "Für Training ohne App, ohne Uhr oder vergessen. Es zählt in Belastung, Form und Wochenübersicht."));

      p.appendChild(lab("Datum"));
      const fd=mk("div","field");
      fd.innerHTML='<input type="date" value="'+E.k+'" max="'+lk(new Date())+'">';
      fd.querySelector("input").addEventListener("input",e=>{ if(e.target.value) E.k=e.target.value; });
      p.appendChild(fd);

      if(!hasEx){
        p.appendChild(lab("Art"));
        const seg=mk("div","seg"); seg.style.marginTop="0";
        KINDS.forEach(([k,l])=>{
          const b=mk("button",E.kind===k?"on":"",l);
          b.addEventListener("click",()=>{ E.kind=k; err=""; draw(); });
          seg.appendChild(b);
        });
        p.appendChild(seg);
      }

      p.appendChild(lab("Umfang"));
      const row=mk("div"); row.style.cssText="display:flex;gap:10px";
      if(E.kind==="run"){
        const f1=mk("div","field"); f1.style.flex="1";
        f1.innerHTML='<input type="number" inputmode="decimal" step="0.1" value="'+esc(E.km)+'" placeholder="Strecke"><u>km</u>';
        f1.querySelector("input").addEventListener("input",e=>{E.km=e.target.value;});
        row.appendChild(f1);
      }
      const f2=mk("div","field"); f2.style.flex="1";
      f2.innerHTML='<input type="number" inputmode="numeric" value="'+esc(E.min)+'" placeholder="Dauer"><u>min</u>';
      f2.querySelector("input").addEventListener("input",e=>{E.min=e.target.value;});
      row.appendChild(f2);
      p.appendChild(row);

      if(E.kind!=="run"){
        p.appendChild(lab("Wie war es?"));
        const seg=mk("div","seg"); seg.style.marginTop="0";
        EFF.forEach(([l,v])=>{
          const b=mk("button",E.eff===v?"on":"",l);
          b.addEventListener("click",()=>{ E.eff=v; draw(); });
          seg.appendChild(b);
        });
        p.appendChild(seg);
      }

      p.appendChild(lab("Bezeichnung"));
      const fl=mk("div","field");
      fl.innerHTML='<input type="text" value="'+esc(E.label)+'" placeholder="optional">';
      fl.querySelector("input").addEventListener("input",e=>{E.label=e.target.value;});
      p.appendChild(fl);

      if(err) p.appendChild(mk("div","note",esc(err)));
      const sv=mk("button","btn",edit?"Änderungen speichern":"Einheit speichern");
      sv.addEventListener("click",commit);
      p.appendChild(sv);
      if(edit){
        const d=mk("button","btn plain","Eintrag löschen");
        d.addEventListener("click",remove);
        p.appendChild(d);
      }
      const c=mk("button","btn sec","Abbrechen");
      c.addEventListener("click",closeSheet);
      p.appendChild(c);
    });
  }
  draw();
}

/* ---------- Alle Einträge ---------- */
function listSheet(){
  openSheet(p=>{
    p.appendChild(mk("div","sheet-h","Einträge"));
    p.appendChild(mk("div","sheet-s","Antippen zum Bearbeiten oder Löschen. Neueste zuerst."));
    const g=mk("div","group");
    const rows=S.history.map((h,i)=>({h,i})).sort((a,b)=>new Date(b.h.date)-new Date(a.h.date)).slice(0,40);
    if(!rows.length) g.appendChild(mk("div","row",'<div class="main"><div class="t">Noch keine Einträge</div></div>'));
    rows.forEach(({h,i})=>{
      const right=h.run?h.run.km+" km":h.dur?Math.round(h.dur/60)+" min":"";
      const r=mk("div","row tap");
      r.innerHTML='<div class="main"><div class="t">'+esc(h.label||"Einheit")+(h.src==="manual"?" ✎":"")+'</div><div class="s">'+fmtDay(h.date)+(h.run&&h.run.min?" · "+h.run.min+" min":"")+'</div></div><div class="v">'+esc(right)+'</div>'+chev();
      r.addEventListener("click",()=>entrySheet(null,i));
      g.appendChild(r);
    });
    p.appendChild(g);
    const c=mk("button","btn sec","Schließen"); c.addEventListener("click",closeSheet); p.appendChild(c);
  });
}

/* ---------- Tage ohne Eintrag ---------- */
function gapStats(){
  const first=firstKey(); if(!first) return null;
  let none=0,rest=0,trained=0,total=0;
  const d=new Date(); d.setDate(d.getDate()-1);
  while(lk(d)>=first){
    const k=lk(d); total++;
    if(S.history.some(h=>lk(h.date)===k)) trained++;
    else if(RD()[k]) rest++;
    else none++;
    d.setDate(d.getDate()-1);
  }
  return {total,trained,rest,none};
}
function daysSheet(){
  openSheet(p=>{
    p.appendChild(mk("div","sheet-h","Fehlende Tage"));
    p.appendChild(mk("div","sheet-s","Die letzten 28 Tage ohne Eintrag. Fehlende Aufzeichnung ist nicht dasselbe wie Ruhe — sag der Analyse, was es war."));
    const first=firstKey();
    const g=mk("div","group"); let n=0;
    for(let i=1;i<=28;i++){
      const d=new Date(); d.setDate(d.getDate()-i);
      const k=lk(d);
      if(first&&k<first) break;
      if(S.history.some(h=>lk(h.date)===k)) continue;
      n++;
      const rest=!!RD()[k];
      const r=mk("div","row");
      r.innerHTML='<div class="main"><div class="t">'+fmtDay(d)+'</div><div class="s">'+(rest?"als Ruhetag markiert":"ohne Eintrag")+'</div></div>';
      const b1=mk("button","btn sm sec",rest?"Zurücknehmen":"Ruhetag");
      b1.addEventListener("click",()=>{ if(rest) delete RD()[k]; else RD()[k]=true; save(); renderAll(); daysSheet(); });
      r.appendChild(b1);
      if(!rest){
        const b2=mk("button","btn sm","Training");
        b2.addEventListener("click",()=>entrySheet({k}));
        r.appendChild(b2);
      }
      g.appendChild(r);
    }
    if(!n) g.appendChild(mk("div","row",'<div class="main"><div class="t">Alles geklärt</div><div class="s">Kein Tag ohne Eintrag</div></div>'));
    p.appendChild(g);
    const c=mk("button","btn sec","Schließen"); c.addEventListener("click",closeSheet); p.appendChild(c);
  });
}

/* ---------- Hinweis auf offene Einheiten ---------- */
window.missedBanner=function(root){
  const m=missed(); if(!m.length) return;
  root.appendChild(mk("div","sect","Noch offen<span class='aux'>letzte 3 Tage</span>"));
  const g=mk("div","group");
  m.forEach(x=>{
    const what=x.need.map(n=>n.label+(n.km?" "+n.km+" km":"")).join(" + ");
    g.appendChild(mk("div","row",'<div class="main"><div class="t">'+WD[x.d.getDay()]+' · '+esc(what)+'</div><div class="s">Kein Eintrag — trainiert oder Ruhetag?</div></div>'));
    const act=mk("div","row"); act.style.gap="10px";
    const a=mk("button","btn sm","Nachtragen"); a.style.flex="1";
    a.addEventListener("click",()=>entrySheet(Object.assign({k:x.k},x.need[0])));
    const b=mk("button","btn sm sec","Ruhetag"); b.style.flex="1";
    b.addEventListener("click",()=>{ RD()[x.k]=true; save(); renderAll(); });
    act.appendChild(a); act.appendChild(b); g.appendChild(act);
  });
  root.appendChild(g);
};

/* ---------- Bereich „Analyse anpassen“ ---------- */
window.adjustCard=function(root){
  root.appendChild(mk("div","sect","Analyse anpassen"));
  const g=mk("div","group");
  const add=(t,s,fn)=>{
    const r=mk("div","row tap");
    r.innerHTML='<div class="main"><div class="t">'+t+'</div><div class="s">'+s+'</div></div>'+chev();
    r.addEventListener("click",fn); g.appendChild(r);
  };
  const st=gapStats();
  add("Einheit nachtragen","Training ohne App, ohne Uhr oder vergessen",()=>entrySheet());
  add("Einträge ansehen und ändern",S.history.length+" Einheiten",listSheet);
  add("Fehlende Tage prüfen",st?st.none+" ohne Eintrag · "+st.rest+" als Ruhetag markiert":"noch keine Tage zu prüfen",daysSheet);
  root.appendChild(g);

  root.appendChild(mk("div","sect","Gewichtung<span class='aux'>je Minute ohne Tempo</span>"));
  const seg=mk("div","seg"); const kw=S.kw||0.7;
  [["leicht",0.5],["normal",0.7],["hart",0.9]].forEach(([l,v])=>{
    const b=mk("button",kw===v?"on":"",l);
    b.addEventListener("click",()=>{ S.kw=v; save(); renderAll(); });
    seg.appendChild(b);
  });
  root.appendChild(seg);
  root.appendChild(mk("div","note","So stark zählt eine Minute Kraft, Rad oder anderer Sport in Belastung und Form. Läufe werden aus dem Tempo gerechnet und sind davon nicht betroffen."));
  if(st&&st.total>0)
    root.appendChild(mk("div","note","Seit Beginn: "+st.trained+" Tage mit Eintrag, "+st.rest+" als Ruhetag markiert, "+st.none+" ohne Angabe. Tage ohne Angabe gehen mit Belastung null ein — das ist keine Ruhe, sondern eine Lücke."));
};

/* ---------- Einhängen ---------- */
const base=window.renderAnalyse;
window.renderAnalyse=function(){
  if(base) base();
  const root=document.querySelector("#s-analyse"); if(!root) return;
  const holder=mk("div");
  window.missedBanner(holder);
  if(holder.children.length) root.insertBefore(holder,root.children[2]||null);
  window.adjustCard(root);
};
if(typeof renderAll==="function") renderAll();
})();
</script>
