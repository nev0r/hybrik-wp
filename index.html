<title>Hybrid/Wk</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hybrid">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#000000;
  --panel:#121212;
  --panel-2:#1B1B1B;
  --line:#282828;
  --line-soft:#1E1E1E;
  --paper:#EFEDE8;
  --fg:#F4F2EE;
  --dim:#8B8983;
  --dimmer:#5C5A56;
  --r:14px;
  --pad:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ink);color:var(--fg)}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.45;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}
#grain{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.35;mix-blend-mode:soft-light}
.wrap{max-width:520px;margin:0 auto;padding:0 var(--pad)}

/* ---------- type ---------- */
.display{
  font-family:Anton,Haettenschweiler,"Arial Narrow",Impact,sans-serif;
  font-weight:400;letter-spacing:-.01em;line-height:.82;text-transform:uppercase;
}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
header{
  position:sticky;top:env(safe-area-inset-top);z-index:40;background:rgba(0,0,0,.86);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.bar{display:flex;align-items:center;justify-content:space-between;height:52px}
.brand{font-family:Anton,Impact,sans-serif;font-size:19px;letter-spacing:.02em;text-transform:uppercase}
.brand span{color:var(--dimmer)}
.bar-right{display:flex;align-items:center;gap:10px}
.ring{width:30px;height:30px;display:block}
.bar-meta{font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;text-align:right}

/* ---------- day strip ---------- */
.strip{display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;min-width:46px;padding:8px 0;text-align:center;
  border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--dim);
  font-size:11px;letter-spacing:.16em;font-weight:600;text-transform:uppercase;cursor:pointer;
  transition:background .16s ease,color .16s ease,border-color .16s ease;
}
.chip.on{background:var(--paper);color:#000;border-color:var(--paper)}
.chip.done{border-color:#4A4A4A;color:#C9C7C2}
.chip.today::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:currentColor;margin:4px auto -4px}

/* ---------- hero ---------- */
.hero{padding:14px 0 16px;border-bottom:1px solid var(--line-soft)}
.hero h1{margin:0;font-size:clamp(52px,17vw,86px)}
.hero .sub{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.tag{
  border:1px solid var(--line);border-radius:999px;padding:5px 12px;
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#D6D4CF;font-weight:600;
}
.tag.solid{background:var(--paper);color:#000;border-color:var(--paper)}

/* ---------- blocks ---------- */
.block{margin:18px 0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.block-head{
  display:flex;align-items:baseline;gap:12px;padding:12px 14px;
  background:#000;border-bottom:1px solid var(--line);
}
.block-head h2{
  margin:0;font-family:Anton,Impact,sans-serif;font-size:17px;letter-spacing:.12em;
  text-transform:uppercase;font-weight:400;
}
.block-head .note{font-size:11px;color:var(--dim);letter-spacing:.04em;flex:1;text-align:right}

/* table */
.thead{
  display:grid;grid-template-columns:1fr 44px 66px;gap:8px;padding:9px 14px;
  background:var(--panel-2);border-bottom:1px solid var(--line);
  font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:600;
}
.thead span:nth-child(2),.thead span:nth-child(3){text-align:center}
.ex{border-bottom:1px solid var(--line-soft)}
.ex:last-child{border-bottom:0}
.ex-top{display:grid;grid-template-columns:1fr 44px 66px;gap:8px;align-items:center;padding:11px 14px}
.ex-name{font-size:14.5px;font-weight:500;letter-spacing:.005em}
.ex-sub{font-size:10.5px;color:var(--dimmer);margin-top:2px;letter-spacing:.08em;text-transform:uppercase}
.ex-sets,.ex-reps{text-align:center;font-size:13px;color:#CFCDC8}
.ex.complete .ex-name{color:var(--dimmer)}
.ex.complete .ex-top{background:#0C0C0C}

.setrow{display:flex;align-items:center;gap:8px;padding:0 14px 12px;flex-wrap:wrap}
.dot{
  width:34px;height:30px;border:1px solid var(--line);border-radius:8px;background:transparent;
  color:var(--dimmer);font-size:11px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s ease,background .14s ease,color .14s ease,border-color .14s ease;
}
.dot:active{transform:scale(.9)}
.dot.on{background:var(--paper);border-color:var(--paper);color:#000}
.kg{
  margin-left:auto;display:flex;align-items:center;gap:6px;
  border:1px solid var(--line);border-radius:8px;padding:0 8px;height:30px;
}
.kg input{
  width:46px;background:transparent;border:0;color:var(--fg);font:inherit;font-size:13px;
  text-align:right;outline:none;font-variant-numeric:tabular-nums;
}
.kg label{font-size:10px;letter-spacing:.14em;color:var(--dimmer);text-transform:uppercase}

/* run */
.run{padding:16px 14px}
.run-top{display:flex;align-items:flex-start;gap:16px}
.run-dist{font-family:Anton,Impact,sans-serif;font-size:34px;line-height:.9;letter-spacing:.01em}
.run-dist small{display:block;font-family:Inter,sans-serif;font-size:10px;letter-spacing:.2em;color:var(--dim);margin-top:7px;font-weight:600}
.run-copy{font-size:11px;line-height:1.7;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);border-left:1px solid var(--line);padding-left:16px;flex:1}
.zone{margin-top:16px}
.zone-track{height:12px;border-radius:999px;background:#0A0A0A;border:1px solid var(--line);overflow:hidden;position:relative}
.zone-fill{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#5E5C58,#EFEDE8);border-radius:999px}
.zone-labels{display:flex;justify-content:space-between;margin-top:7px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--dimmer)}
.splits{margin-top:14px;border-top:1px solid var(--line-soft)}
.split{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.split:last-child{border-bottom:0}
.split b{font-weight:600;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);min-width:88px}
.split span{text-align:right;color:#D8D6D1}

/* meals */
.meal{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line-soft);align-items:flex-start;cursor:pointer}
.meal:last-child{border-bottom:0}
.meal b{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);min-width:74px;padding-top:2px;font-weight:600}
.meal p{margin:0;flex:1;font-size:13.5px;color:#DCDAD5;line-height:1.5}
.meal .box{width:16px;height:16px;border:1px solid var(--line);border-radius:4px;margin-top:2px;flex:0 0 auto;position:relative}
.meal.on .box{background:var(--paper);border-color:var(--paper)}
.meal.on .box::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(42deg)}
.meal.on p{color:var(--dimmer)}

/* checklist (sunday) */
.check{display:flex;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.check:last-child{border-bottom:0}
.check .box{width:18px;height:18px;border:1px solid var(--line);border-radius:5px;flex:0 0 auto;position:relative}
.check.on .box{background:var(--paper);border-color:var(--paper)}
.check.on .box::after{content:"";position:absolute;left:6px;top:2px;width:4px;height:10px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(42deg)}
.check span{font-size:14px}
.check.on span{color:var(--dimmer)}

/* readiness banner */
.ready{
  display:flex;gap:14px;align-items:center;margin:16px 0 0;padding:14px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
}
.ready-score{font-family:Anton,Impact,sans-serif;font-size:40px;line-height:.85;min-width:62px}
.ready-score small{display:block;font-family:Inter,sans-serif;font-size:9px;letter-spacing:.2em;color:var(--dim);margin-top:6px;font-weight:600}
.ready-txt b{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px}
.ready-txt p{margin:0;font-size:13px;color:var(--dim);line-height:1.45}
.ready.empty{border-style:dashed;cursor:pointer}

/* week list */
.wrow{
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:14px 0;border-bottom:1px solid var(--line-soft);cursor:pointer;
}
.wrow:last-child{border-bottom:0}
.wday{font-family:Anton,Impact,sans-serif;font-size:23px;letter-spacing:.02em;text-transform:uppercase}
.wrow.done .wday{color:var(--dimmer)}
.wpills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
.wpill{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#CBC9C4;font-weight:600;white-space:nowrap}
.wpill.off{color:var(--dimmer)}
.wpill.fill{background:var(--paper);color:#000;border-color:var(--paper)}
.wmeta{grid-column:1/-1;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dimmer);margin-top:-4px}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--panel)}
.stat b{font-family:Anton,Impact,sans-serif;font-size:30px;display:block;line-height:1}
.stat i{font-style:normal;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);display:block;margin-top:8px;font-weight:600}
.stat.wide{grid-column:1/-1}
.progress{height:6px;background:#0A0A0A;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--paper);border-radius:999px;transition:width .5s cubic-bezier(.2,.7,.2,1);margin:0}

/* oura */
.oura-hero{padding:22px 0 8px}
.oura-hero h1{margin:0;font-size:clamp(46px,15vw,72px)}
.big-score{display:flex;align-items:flex-end;gap:16px;margin:18px 0 6px}
.big-score .v{font-family:Anton,Impact,sans-serif;font-size:88px;line-height:.78}
.big-score .l{padding-bottom:10px}
.big-score .l b{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.big-score .l span{font-size:12px;color:var(--dim)}
.spark{width:100%;height:64px;display:block;margin:10px 0 4px}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{border:1px solid var(--line);border-radius:var(--r);padding:13px;background:var(--panel)}
.metric b{display:block;font-family:Anton,Impact,sans-serif;font-size:25px;line-height:1}
.metric i{font-style:normal;display:block;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-top:7px;font-weight:600}
.metric u{text-decoration:none;display:block;font-size:11px;color:var(--dimmer);margin-top:3px}

/* buttons + forms */
.btn{
  display:block;width:100%;padding:14px;border-radius:10px;border:1px solid var(--paper);
  background:var(--paper);color:#000;font:inherit;font-weight:600;font-size:12px;
  letter-spacing:.18em;text-transform:uppercase;cursor:pointer;margin-top:10px;
}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.quiet{background:transparent;color:var(--dim);border-color:transparent;letter-spacing:.14em}
.btn:active{transform:scale(.99)}
textarea,input[type=password],input[type=text]{
  width:100%;background:#0A0A0A;border:1px solid var(--line);border-radius:10px;color:var(--fg);
  font:inherit;font-size:13px;padding:12px;outline:none;margin-top:10px;
}
textarea{min-height:120px;resize:vertical;font-size:12px;line-height:1.5}
.hint{font-size:12px;color:var(--dim);line-height:1.55;margin:10px 0 0}
.hint code{background:#0E0E0E;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:11px}
.msg{font-size:12px;margin-top:10px;color:var(--dim);line-height:1.5}
.msg.bad{color:#E7E5E0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:10px}
.seg button{flex:1;padding:11px;background:transparent;border:0;color:var(--dim);font:inherit;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;cursor:pointer}
.seg button.on{background:var(--paper);color:#000}

/* bottom nav */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(0,0,0,.9);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line-soft);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav-in button{
  background:transparent;border:0;color:var(--dimmer);padding:13px 4px 15px;font:inherit;
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.nav-in button.on{color:var(--fg)}
.nav-in svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.foot{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#3A3835;padding:26px 0 10px;border-top:1px solid var(--line-soft);margin-top:26px}
.screen{display:none}
.screen.on{display:block;animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<svg id="grain" aria-hidden="true"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>

<header>
  <div class="wrap bar">
    <div class="brand">Hybrid<span>/Wk</span></div>
    <div class="bar-right">
      <div class="bar-meta" id="barMeta">0/13 Sessions</div>
      <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
        <circle cx="18" cy="18" r="15.5" fill="none" stroke="#282828" stroke-width="3"/>
        <circle id="ringFill" cx="18" cy="18" r="15.5" fill="none" stroke="#EFEDE8" stroke-width="3"
                stroke-linecap="round" stroke-dasharray="97.4" stroke-dashoffset="97.4"
                transform="rotate(-90 18 18)" style="transition:stroke-dashoffset .6s cubic-bezier(.2,.7,.2,1)"/>
      </svg>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="screen on" id="s-week"></section>
  <section class="screen" id="s-day"></section>
  <section class="screen" id="s-oura"></section>
  <section class="screen" id="s-setup"></section>
  <div class="foot"><span>Run. Lift. Recover.</span><span id="footRight">Woche 1</span></div>
</main>

<nav>
  <div class="nav-in">
    <button data-go="week" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Woche</button>
    <button data-go="day"><svg viewBox="0 0 24 24"><path d="M4 9v6M20 9v6M7 6v12M17 6v12M10 12h4"/></svg>Training</button>
    <button data-go="oura"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/></svg>Oura</button>
    <button data-go="setup"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="#000"/><circle cx="15" cy="12" r="2" fill="#000"/><circle cx="8" cy="17" r="2" fill="#000"/></svg>Setup</button>
  </div>
</nav>

<script>
/* ============================================================
   HYBRID/WK — Trainingsplan, Ernährung, Oura-Readiness
   ============================================================ */

const MEALS_BASE = [
  ["Frühstück","3 Eier (Weidehaltung), Sauerteigbrot, Kimchi"],
  ["Snack","Sauerteigbrot + 1 Dose Sardinen"],
  ["Mittag","Skyr-/Joghurtbowl, 1 Scoop Schoko-Protein, gefrorene Blaubeeren, Granola, Honig"]
];

const PLAN = [
  {
    key:"mon", short:"Mo", name:"Montag", tagline:"Push Day + Easy Run",
    lift:{ note:"Brust, Schultern, Trizeps — schwer", ex:[
      {n:"Incline DB Press", s:4, r:"6–8", sub:"Top-Set schwer, dann halten"},
      {n:"Flat Machine Chest Press", s:3, r:"8–10"},
      {n:"Seated DB Shoulder Press", s:4, r:"8–10"},
      {n:"Cable Lateral Raise", s:3, r:"12–15"},
      {n:"Rope Triceps Pushdown", s:3, r:"10–12"},
      {n:"Overhead Cable Triceps Extension", s:3, r:"10–12"}
    ]},
    run:{ label:"Easy Run", zone:"Zone 2", miles:5, bar:[2,46],
      copy:["Aerobe Basis","Locker bleiben","Sprechen möglich"],
      scale:["Easy Effort","Conversational Pace"] },
    meals:[...MEALS_BASE,["Abend","93/7 Hackfleisch (Pute), Süßkartoffeln, Brokkoli"],["Late Snack","Chomps Bar"]]
  },
  {
    key:"tue", short:"Di", name:"Dienstag", tagline:"Pull Day + Tempo Run",
    lift:{ note:"Rücken, hintere Schulter, Bizeps", ex:[
      {n:"Wide Grip Lat Pulldown", s:4, r:"8–10"},
      {n:"Chest-Supported Row", s:4, r:"8–10"},
      {n:"Single Arm Cable Row", s:3, r:"10–12"},
      {n:"Rear Delt Fly", s:3, r:"12–15"},
      {n:"EZ Bar Curl", s:3, r:"8–10"},
      {n:"Hammer Curl", s:3, r:"10–12"}
    ]},
    run:{ label:"Tempo Run", zone:"Tempo", miles:4.5, bar:[26,46],
      copy:["Kontrollierte Härte","Gleichmäßig hart","Nicht zerreißen"],
      scale:["Easy","Tempo","Max"] },
    meals:[...MEALS_BASE,["Abend","Lachs, Kartoffeln, Brokkoli"],["Late Snack","Chomps Bar"]]
  },
  {
    key:"wed", short:"Mi", name:"Mittwoch", tagline:"Legs + Recovery",
    lift:{ note:"Quads, Glutes, Hamstrings", ex:[
      {n:"Barbell Back Squat", s:4, r:"6–8"},
      {n:"Romanian Deadlift", s:4, r:"8–10"},
      {n:"Leg Press", s:3, r:"10–12"},
      {n:"Walking Lunges", s:3, r:"10 pro Seite"},
      {n:"Seated Leg Curl", s:3, r:"10–12"},
      {n:"Standing Calf Raise", s:4, r:"12–15"},
      {n:"Hanging Knee Raise", s:3, r:"12–15"}
    ]},
    run:null,
    rest:{ title:"Kein Lauf", bar:[24,44], scale:["Low Stress","Reset / Recovered"],
      copy:["8–10k Schritte","15–20 Min Mobility","Gut regenerieren, damit die harten Einheiten sitzen"] },
    meals:[...MEALS_BASE,["Abend","93/7 Hackfleisch (Pute), Süßkartoffeln, Brokkoli, Olivenöl"],["Late Snack","Joghurtbowl"]]
  },
  {
    key:"thu", short:"Do", name:"Donnerstag", tagline:"Upper Body + Intervalle",
    lift:{ note:"Oberkörper Kraft", ex:[
      {n:"Incline DB Press", s:4, r:"8–10"},
      {n:"Weighted Pull-Ups", s:4, r:"6–8"},
      {n:"Seated DB Shoulder Press", s:4, r:"8–10"},
      {n:"Chest-Supported Row", s:4, r:"8–10"},
      {n:"Cable Lateral Raise", s:3, r:"10–12"},
      {n:"Face Pulls", s:3, r:"12–15"},
      {n:"Hanging Knee Raises", s:4, r:"10–15", sub:"Bauch"}
    ]},
    run:{ label:"Intervalle", zone:"5K-Pace", miles:4, bar:[54,44],
      copy:["Tempo baut Kapazität","Sauber ausführen","Pausen einhalten"],
      scale:["Easy","Threshold","Max"],
      splits:[["Warm-Up","1 Meile locker — Zone 1–2"],["Hauptteil","6 × 400 m @ 5K-Pace"],["Pause","90 Sek gehen/traben"],["Cool-Down","1 Meile locker"]] },
    meals:[...MEALS_BASE,["Abend","Mageres Steak, Ofenkartoffeln, Brokkoli"],["Late Snack","Chomps Bar"]]

const TOTAL_MILES = PLAN.reduce((a,d)=>a+(d.run?d.run.miles:0),0);
const TOTAL_SESSIONS = PLAN.reduce((a,d)=>a+(d.lift?1:0)+(d.run?1:0)+(d.recovery?1:0),0);

/* ---------- state ---------- */
const KEY = "hybridwk:v1";
let S = { unit:"mi", sets:{}, kg:{}, meals:{}, checks:{}, runDone:{}, oura:null, day:null, week:1, clientId:"", token:"", tokenUntil:0 };
let saveTimer = null;

/* Speicher: Claude-Artifact -> Safari/Home-Screen -> Arbeitsspeicher */
const store = {
  async get(k){
    if(window.storage && window.storage.get){
      try{ const r = await window.storage.get(k); return r ? r.value : null; }catch(e){}
    }
    try{ return window.localStorage.getItem(k); }catch(e){ return null; }
  },
  async set(k,v){
    if(window.storage && window.storage.set){
      try{ await window.storage.set(k,v); return; }catch(e){}
    }
    try{ window.localStorage.setItem(k,v); }catch(e){}
  },
  async del(k){
    if(window.storage && window.storage.delete){
      try{ await window.storage.delete(k); }catch(e){}
    }
    try{ window.localStorage.removeItem(k); }catch(e){}
  }
};
async function load(){
  const raw = await store.get(KEY);
  if(raw){ try{ S = Object.assign(S, JSON.parse(raw)); }catch(e){} }
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>store.set(KEY, JSON.stringify(S)), 350);
}
function redirectUri(){ return location.origin + location.pathname; }
function authUrl(){
  return "https://cloud.ouraring.com/oauth/authorize?" + new URLSearchParams({
    response_type:"token",
    client_id:(S.clientId||"").trim(),
    redirect_uri:redirectUri(),
    scope:"personal daily heartrate workout session spo2 ring_configuration",
    state:"hybridwk"
  }).toString();
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dist = mi => S.unit==="km" ? (mi*1.60934).toFixed(1)+" km" : mi+" mi";
const distNum = mi => S.unit==="km" ? (mi*1.60934).toFixed(1) : mi;

function todayKey(){ return ["sun","mon","tue","wed","thu","fri","sat"][new Date().getDay()]; }
function day(k){ return PLAN.find(d=>d.key===k) || PLAN[0]; }

function liftDone(d){
  if(!d.lift) return false;
  return d.lift.ex.every((ex,i)=>{
    for(let s=1;s<=ex.s;s++) if(!S.sets[d.key+"|"+i+"|"+s]) return false;
    return true;
  });
}
function daySessions(d){
  let done=0, total=0;
  if(d.lift){ total++; if(liftDone(d)) done++; }
  if(d.run){ total++; if(S.runDone[d.key]) done++; }
  if(d.recovery){ total++; if(d.recovery.every((_,i)=>S.checks[d.key+"|"+i])) done++; }
  return {done,total};
}
function weekDone(){ return PLAN.reduce((a,d)=>a+daySessions(d).done,0); }
function milesDone(){ return PLAN.reduce((a,d)=>a+(d.run && S.runDone[d.key] ? d.run.miles : 0),0); }

/* ---------- Oura Coaching ---------- */
function latestOura(){
  if(!S.oura || !S.oura.days || !S.oura.days.length) return null;
  return S.oura.days[S.oura.days.length-1];
}
function coach(o, d){
  if(!o) return null;
  const r = o.readiness ?? 0;
  const shortSleep = o.sleep != null && o.sleep < 6.2;
  if(r >= 85) return {t:"Grünes Licht", p:"Readiness stark. Plan wie geschrieben, obere Wiederholungszahl und ruhig 2,5 kg drauf."};
  if(r >= 70) return {t:"Plan läuft", p: shortSleep
      ? "Readiness ok, Schlaf kurz. Lift wie geplant, Lauf am unteren Ende der Spanne."
      : "Solide Erholung. Alles wie im Plan, Pausen sauber einhalten."};
  if(r >= 60) return {t:"Gedrosselt", p: d && d.run && d.run.label!=="Easy Run"
      ? "Intensität raus: harten Lauf heute in Zone 2 umwandeln, Lift −10 % Gewicht."
      : "Lift −10 % Gewicht, letzte Sätze nicht bis zum Versagen. Lauf locker."};
  return {t:"Reset-Tag", p:"Readiness niedrig. Heute nur Spaziergang und Mobility, harte Einheit auf morgen schieben."};
}

    <input type="text" id="clientId" placeholder="Client ID" autocomplete="off" spellcheck="false" value="${esc(S.clientId||"")}">
    <p class="msg">${S.token?"Token aktiv"+(S.tokenUntil?" bis "+new Date(S.tokenUntil).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"")+"." : "Noch kein Token."}</p>`;
  const bosave = el("button","btn ghost","Client ID sichern");

  boi.appendChild(bosave);
  if(S.token){
    const drop = el("button","btn quiet","Token löschen");
    drop.addEventListener("click",()=>{ S.token=""; S.tokenUntil=0; save(); renderSetup(); renderOura(); });

    save(); renderAll();
  });
  inner.appendChild(reset);
  const wipe = el("button","btn quiet","Alle Daten löschen");
  wipe.addEventListener("click",async ()=>{
    if(!confirm("Wirklich alles löschen, inklusive Gewichte und Oura-Daten?")) return;
    S = { unit:"mi", sets:{}, kg:{}, meals:{}, checks:{}, runDone:{}, oura:null, day:null, week:1 };
    try{ await window.storage.delete(KEY); }catch(e){}
    renderAll();

  inner.appendChild(wipe);

  ex.appendChild(ta);

/* ============================================================
   OURA IO
   ============================================================ */
function demoOura(){
  const base = [[71,6.4,54,52,0.2],[78,7.1,61,50,0.1],[64,5.9,48,54,0.4],[83,7.8,70,48,-0.1],[88,8.1,74,47,-0.2],[75,6.8,58,50,0.1],[81,7.5,66,49,0]];
  const days = base.map((v,i)=>{
    const d = new Date(); d.setDate(d.getDate()-(6-i));
    return {date:d.toISOString().slice(0,10), readiness:v[0], sleep:v[1], hrv:v[2], rhr:v[3], temp:v[4]};
  });
  return {source:"demo", days};
}

function normalize(map){
  const days = Object.keys(map).sort().map(k=>map[k]);
  return days.filter(d=>d.readiness!=null || d.sleep!=null).slice(-14);
}

function collect(obj, map){
  const arr = Array.isArray(obj) ? obj : (obj && Array.isArray(obj.data) ? obj.data : null);
  if(!arr){
    if(obj && typeof obj==="object"){ Object.values(obj).forEach(v=>{ if(v && typeof v==="object") collect(v,map); }); }
    return;
  }
  arr.forEach(it=>{
    if(!it || typeof it!=="object") return;
    const date = it.day || it.date || (it.timestamp||"").slice(0,10) || (it.bedtime_end||"").slice(0,10);
    if(!date) return;
    const e = map[date] || (map[date] = {date});
    if(it.readiness!=null) e.readiness = Math.round(it.readiness);
    if(it.score!=null && it.total_sleep_duration==null && it.average_hrv==null) e.readiness = Math.round(it.score);
    if(it.sleep!=null && typeof it.sleep==="number") e.sleep = it.sleep;
    if(it.total_sleep_duration!=null) e.sleep = +(it.total_sleep_duration/3600).toFixed(1);
    if(it.hrv!=null) e.hrv = Math.round(it.hrv);
    if(it.average_hrv!=null) e.hrv = Math.round(it.average_hrv);
    if(it.rhr!=null) e.rhr = Math.round(it.rhr);
    if(it.lowest_heart_rate!=null) e.rhr = Math.round(it.lowest_heart_rate);
    if(it.average_heart_rate!=null && e.rhr==null) e.rhr = Math.round(it.average_heart_rate);
    if(typeof it.temperature_deviation === "number") e.temp = it.temperature_deviation;
    if(typeof it.temp === "number") e.temp = it.temp;
    if(typeof it.steps === "number") e.steps = it.steps;
  });
}

function importOura(text){
  const out = $("#jsonMsg");
  if(!text || !text.trim()){ if(out) out.textContent = "Da ist noch nichts eingefügt."; return; }
  const map = {};
  let ok = false;
  text.split(/\n(?=\s*[\{\[])/).forEach(chunk=>{
    try{ collect(JSON.parse(chunk), map); ok = true; }catch(e){}
  });
  if(!ok){ try{ collect(JSON.parse(text), map); ok = true; }catch(e){} }
  const days = normalize(map);
  if(!days.length){
    if(out) out.textContent = "Kein Datum mit Readiness oder Schlaf gefunden. Prüf, ob der komplette Antwort-Block drin ist.";
    return;
  }
  S.oura = {source:"json", days};
  save(); renderOura(); renderDay();
}

async function fetchOura(){
  const out = $("#ouraMsg");
  const token = S.token;
  if(!token){ if(out) out.textContent = "Kein Token. Erst mit Oura verbinden."; return; }
  if(out) out.textContent = "Hole Daten …";
  const end = new Date(), start = new Date(); start.setDate(start.getDate()-13);
  const q = `?start_date=${start.toISOString().slice(0,10)}&end_date=${end.toISOString().slice(0,10)}`;
  const map = {};
  let hardFail = null;
  try{
    for(const route of ["daily_readiness","daily_sleep","sleep"]){
      const res = await fetch("https://api.ouraring.com/v2/usercollection/"+route+q, {
        headers:{ Authorization:"Bearer "+token }
      });
      if(res.status === 401){ hardFail = "Das Token gilt nicht mehr. Einmal neu mit Oura verbinden."; break; }
      if(!res.ok) continue;
      collect(await res.json(), map);
    }
  }catch(e){
    if(out) out.textContent = "Der Browser lässt den direkten Zugriff auf die Oura-API nicht zu. Nimm den Kurzbefehl und setz die Daten unten als JSON ein.";
    return;
  }
  if(hardFail){ S.token=""; save(); if(out) out.textContent = hardFail; return; }
  const days = normalize(map);
  if(!days.length){ if(out) out.textContent = "Verbindung stand, aber es kamen keine Tage zurück."; return; }
  S.oura = {source:"oura", days};
  save(); renderOura(); renderDay(); refreshRing();
}

/* Übergabe per URL: #access_token=… (OAuth) oder #oura=… (Kurzbefehl) */
function readHash(){
  const h = location.hash.replace(/^#/,"");
  if(!h) return null;
  const p = new URLSearchParams(h);
  let handled = null;
  if(p.get("access_token")){
    S.token = p.get("access_token");
    S.tokenUntil = Date.now() + (parseInt(p.get("expires_in")||"0",10)*1000);
    handled = "token";
  }
  if(p.get("oura")){
    try{ importOura(decodeURIComponent(p.get("oura"))); handled = "data"; }catch(e){}
  }
  if(handled){
    try{ history.replaceState(null,"",redirectUri()); }catch(e){ location.hash = ""; }
  }
  return handled;
}

/* ============================================================
   NAV
   ============================================================ */
function go(name){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  $("#s-"+name).classList.add("on");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.go===name));
  window.scrollTo({top:0});
}
document.querySelectorAll("nav button").forEach(b=>{
  b.addEventListener("click",()=>{ if(b.dataset.go==="day" && !S.day) S.day = todayKey(); renderAll(false); go(b.dataset.go); });
});

function refreshRing(){
  const done = weekDone(), pct = done/TOTAL_SESSIONS;
  $("#ringFill").setAttribute("stroke-dashoffset", (97.4*(1-pct)).toFixed(1));
  $("#barMeta").textContent = done+"/"+TOTAL_SESSIONS+" Sessions";
  $("#footRight").textContent = "Woche "+(S.week||1);
}
function renderAll(){
  renderWeek(); renderDay(); renderOura(); renderSetup(); refreshRing();
}

(async function init(){
  await load();
  if(!S.day) S.day = todayKey();
  const from = readHash();
  renderAll();
  if(from === "token"){ save(); go("oura"); fetchOura(); }
  if(from === "data"){ go("oura"); }
  if(location.protocol === "https:" && "serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
</script>
