function fresh(){return JSON.parse(JSON.stringify(BASE))}function load(){try{const raw=localStorage.getItem('hybridwk-v3')||localStorage.getItem('hybridwk');if(raw){let x=JSON.parse(raw);return Object.assign(fresh(),x)}}catch(e){try{if(window.storage&&typeof window.storage.get==='function'){let x=window.storage.get('hybridwk-v3');if(x&&typeof x==='object')return Object.assign(fresh(),x)}}catch(_){}}return fresh()}let S=load();
function save(){try{localStorage.setItem('hybridwk-v3',JSON.stringify(S))}catch(e){try{if(window.storage&&typeof window.storage.set==='function')window.storage.set('hybridwk-v3',S)}catch(_){toast('Speichern nicht möglich – bitte Backup erstellen.')}}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function round25(x){return Math.round(x/2.5)*2.5}function paceToSec(p){let m=String(p||'6:30').split(':').map(Number);return (m[0]||0)*60+(m[1]||0)}function secToPace(s){return `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`}function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function today(){return dateKey(new Date())}function dow(){return (new Date().getDay()+6)%7}function wk(){return W[Math.floor((S.week-1)/4)]}function wi(){return (S.week-1)%4}function isDeload(){return wi()===3&&S.week!==16}function block(){return ['Base','Build','Strength','Peak'][Math.floor((S.week-1)/4)]}function mainSets(){return S.week===16?[3,3]:isDeload()?wk().deload:wk().main}function auxSets(){return isDeload()?2:wk().aux}function workWeight(key){return round25((Number(S.weights[key]||0))*wk().factor[wi()])}function weekOrder(){let order=[...(S.dayOrder[S.week]||PLAN.map((_,i)=>i))];if(order.length===7&&order[6]!==6){let idx=order.indexOf(6),swap=order[6];if(idx>=0){order[6]=6;order[idx]=swap;S.dayOrder[S.week]=order;save()}}return order}function getPlan(day){let order=weekOrder();return PLAN[order[day]??day]}function runDescription(kind){if(kind==='easy')return `${wk().easy[wi()]} km locker`;if(kind==='long')return `${wk().long[wi()]} km langer Lauf`;return wk().quality[wi()]}function targetPace(kind){let p=paceToSec(S.pace);if(kind==='long')return secToPace(p+10);if(kind!=='quality')return secToPace(p);let q=wk().quality[wi()].toLowerCase();if(q.includes('tempo'))return secToPace(p-45);if(q.includes('400')||q.includes('800')||q.includes('strides'))return secToPace(p-70);if(q.includes('locker'))return secToPace(p);if(q.includes('test')){let prediction=runAnalysis().predictions.find(x=>x.distance===5);return prediction?secToPace(prediction.daniels/5):'noch offen'}return secToPace(p-60)}function toast(s){let t=document.getElementById('toast');if(t){t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)}}

function weekOverview(){let order=weekOrder();return `<div class="list">${order.map((pi,day)=>{let p=PLAN[pi],done=S.completed[`${S.week}-${day}`],desc=p.run?runDescription(p.run):p.key==='rehab'?'Recovery-Rituale · kein Workout':p.key==='rest'?'Erholung':`${mainSets()[0]} × ${mainSets()[1]} Hauptlift · ${auxSets()} Zusatzsätze`;return `<div class="listrow"><button class="subtle" data-day="${day}" aria-label="${DAYS[day]} ansehen" style="min-width:42px">${DAYS[day]}</button><div class="grow"><b>${esc(p.name)}</b><div class="small muted">${esc(desc)}${p.run?` · ${targetPace(p.run)}/km`:''}</div></div><button class="check ${done?'done':''}" data-done="${day}" aria-label="Einheit ${done?'erledigt':'offen'}">${done?'✓':'○'}</button></div>`}).join('')}</div>`}
function smallestSafeSwap(order){let base=collision(order),baseHard=base.filter(x=>x.type==='Kollision').length,baseHints=base.filter(x=>x.type==='Hinweis').length,best=null;for(let i=dow();i<7;i++)for(let j=i+1;j<7;j++){if(i===6||j===6||order[i]===6||order[j]===6||S.completed[`${S.week}-${i}`]||S.completed[`${S.week}-${j}`])continue;let next=[...order];[next[i],next[j]]=[next[j],next[i]];let c=collision(next),hard=c.filter(x=>x.type==='Kollision').length,hints=c.filter(x=>x.type==='Hinweis').length;if(hard<baseHard||(hard===baseHard&&hints<baseHints)){let score=hard*10+hints;if(!best||score<best.score)best={from:i,to:j,score,hard,hints}}}return best}
function program(){let order=weekOrder(),c=collision(order),fix=smallestSafeSwap(order);let cHtml=c.length?c.map(x=>`<div class="small ${x.type==='Kollision'?'ember':'muted'}">${x.type==='Kollision'?'⚠':'·'} ${x.text}</div>`).join(''):'<span class="pill">Keine Kollisionen im Plan</span>';let open=S.logs.some(l=>l.date===today());return `<section class="hero"><div class="hero-kicker"><span class="hero-dot"></span>HYBRID / WK · 16-WOCHEN-SYSTEM</div><h1>Train with<em>intent.</em></h1><p>Kraft und Ausdauer, im eigenen Rhythmus – mit Erholung fest im Plan.</p><button class="primary hero-cta" data-go="training">Heutigen Tag öffnen <span aria-hidden="true">↗</span></button><div class="hero-state"><span>AKTUELLER BLOCK</span><b>${block()} · WOCHE ${S.week} / 16</b></div></section><section class="section"><div class="grid"><div class="metric"><span class="muted">Block</span><b>${block()}</b></div><div class="metric"><span class="muted">Ziel-RPE</span><b>${wk().rpe[wi()]}</b></div><div class="metric"><span class="muted">Easy Run</span><b>${wk().easy[wi()]} km</b></div><div class="metric"><span class="muted">Long Run</span><b>${wk().long[wi()]} km</b></div></div><div class="card"><div class="row"><b>Wochencheck</b><span class="pill">${c.length?c.length+' Hinweis(e)':'Plan geprüft'}</span></div><div style="margin-top:10px">${cHtml}</div>${fix&&c.some(x=>x.type==='Kollision')?`<div class="small muted" style="margin-top:8px">Kleinster Tausch, der mindestens eine Kollision entfernt: ${DAYS[fix.from]} ↔ ${DAYS[fix.to]}.</div><button class="outline" data-best-swap="${fix.from},${fix.to}" style="margin-top:8px">Vorschlag übernehmen</button>`:''}<div class="actions"><button class="outline" data-move-current>Einheit verschieben</button><button class="outline" data-weekfinish>Woche abschließen</button></div></div></section><section class="section"><h2>Wochenplan</h2>${weekOverview()}</section>${open?'':`<section class="section"><div class="card"><div class="row"><div><b>Noch offen?</b><div class="small muted">Einheit nachtragen oder Ruhetag markieren.</div></div><button class="outline" data-go="analyse">Prüfen</button></div></div></section>`}<section class="section"><h2>Lean bleiben</h2><div class="card small">Protein zuerst: 1,6–2,2 g/kg${S.bodyweight?` (bei ${S.bodyweight} kg: ${(S.bodyweight*1.6).toFixed(0)}–${(S.bodyweight*2.2).toFixed(0)} g/Tag)`:''}. Kohlenhydrate um das Training. Kleines Defizit statt Crash; dauerhaft zu wenig Energie kann Leistung und Gesundheit beeinträchtigen. Schlaf 7–9 Stunden. Wenn Aussehen oder Essen dein Training bestimmen, sprich mit ärztlicher Fachperson. Bei Brustschmerz, Schwindel oder Puls, der nicht runtergeht: bitte abklären lassen.</div></section><section class="section"><h2>Routine & Gesundheit</h2>${routinePanel()}</section><section class="section"><h2>Mahlzeiten heute</h2>${mealPanel()}</section><section class="section"><h2>CrossFit WOD</h2><p class="small muted">Optionaler Abschluss – WOD zählt nicht als geplante Trainingseinheit und ist am Sonntag pausiert.</p>${wodPanel()}</section>`}
function mealPanel(){S.meals=S.meals||{};let eaten=S.meals[today()]||{};return `<div class="card tight">${['Frühstück','Mittagessen','Abendessen'].map((name,i)=>`<div class="listrow"><span>${name}</span><button class="check ${eaten[i]?'done':''}" data-meal="${i}">${eaten[i]?'✓':'○'}</button></div>`).join('')}<p class="tiny muted">Nur abhaken – keine Kalorien oder Ernährungswerte geschätzt.</p></div>`}
function routinePanel(recovery=false){let t=today(),r=S.routine[t]||[],items=['Tageslicht','Wasser','Protein','Schritte','Hautpflege','Bildschirm aus','Feste Schlafenszeit','Zähne'];if(S.creatine)items.push('Kreatin eingenommen');if(S.caffeine&&!recovery)items.push('Koffein vor Training');let sleep=S.sleep.filter(x=>x.date>=dateAgo(6)).map(x=>x.hours);let avg=sleep.length?(sleep.reduce((a,b)=>a+b,0)/sleep.length).toFixed(1):'—';return `<div class="card tight"><div class="row"><b>${r.length}/${items.length} erledigt</b><span class="pill">Serie ${routineStreak()} Tage</span></div>${items.map((x,i)=>`<div class="listrow"><span class="small">${x}</span><button class="check ${r.includes(i)?'done':''}" data-routine="${i}">${r.includes(i)?'✓':'○'}</button></div>`).join('')}<div class="formgrid" style="padding:12px 4px 3px"><div><label>Schlaf letzte Nacht (Std.)</label><input id="sleepValue" type="number" min="0" max="16" step="0.1" value="${S.sleep.find(x=>x.date===t)?.hours??''}"></div><div><label>7-Tage-Schnitt</label><div class="metric"><b>${avg}</b><span class="small muted">Stunden</span></div></div></div><button class="primary" data-save-sleep style="margin:8px 4px 2px">Schlaf speichern</button></div>`}
function dateAgo(days){let d=new Date();d.setDate(d.getDate()-days);return dateKey(d)}function routineStreak(){let n=0,d=new Date(),todayPoints=(S.routine[today()]||[]).length;if(todayPoints<5)d.setDate(d.getDate()-1);for(let i=0;i<366;i++){let k=dateKey(d);if((S.routine[k]||[]).length<5)break;n++;d.setDate(d.getDate()-1)}return n}
function wodPanel(){let w=S.wods.at(-1);return `<div class="card"><div class="row"><div><b>${w?esc(w.name):'Optionales WOD'}</b><div class="small muted">${w?esc(w.description):'Kurzer Metcon als Trainingsabschluss.'}</div></div><button class="primary" data-wod>${w?'Neues WOD':'WOD starten'}</button></div>${w?`<div class="grid3" style="margin-top:12px"><div class="metric"><span class="muted small">Zeit</span><b>${esc(w.time||'offen')}</b></div><div class="metric"><span class="muted small">Runden</span><b>${esc(w.rounds||'—')}</b></div><div class="metric"><span class="muted small">Status</span><b>${w.done?'✓':'offen'}</b></div></div><div class="actions"><button class="outline" data-woddone>${w.done?'Erledigt ✓':'WOD abhaken'}</button><button class="outline" data-wodresult>Ergebnis eintragen</button></div>`:''}</div>`}
function workoutDesc(day){let p=getPlan(day);if(!p)return '—';if(p.run)return runDescription(p.run);return p.name}
function rehabView(di){S.rehab=S.rehab||{};let st=S.rehab[today()]||{},tasks=[['walk','Locker spazieren oder kurz bewegen'],['mobility','Sanfte Mobilität nach Gefühl'],['mealPrep','Mahlzeiten für morgen grob planen'],['sleepPlan','Schlafenszeit für heute festlegen']];return `<section class="section"><div class="card"><span class="pill">${DAYS[di]} · REHAB & RECOVERY</span><div class="big" style="margin:12px 0">Reset statt Training</div><p class="muted">Sonntag ist trainingsfrei: kein Krafttraining, Lauf oder WOD. Das ist allgemeine Regeneration, kein Behandlungsplan für Verletzungen.</p><div class="small muted">Rituale sind Vorschläge, keine Pflicht oder Punktzahl. Lass weg, was sich nicht gut anfühlt.</div></div><h2>Sanfter Reset</h2><div class="list">${tasks.map(([k,label])=>`<div class="listrow"><span class="grow">${label}</span><button class="check ${st[k]?'done':''}" data-rehab="${k}" aria-label="${label}">${st[k]?'✓':'○'}</button></div>`).join('')}</div><div class="card"><b>Bewegung ohne Zusatzbelastung</b><p class="small muted">Optionaler Spaziergang in Plaudertempo oder ein paar Minuten angenehme, schmerzfreie Beweglichkeit. Nicht in Schmerz hinein dehnen; bei zunehmenden Beschwerden abbrechen. Kein Ersatz für Physio oder medizinische Abklärung.</p></div><div class="card"><b>Essen & Trinken</b><p class="small muted">Normale, ausgewogene Mahlzeiten mit einer Proteinquelle und Kohlenhydraten; kein spezielles „Recovery-Food“ nötig. Trink normal nach Durst und ersetze deutliche Schweißverluste – keine erzwungenen Trinkmengen. Für Trainierende sind Gesamtzufuhr und regelmäßige Proteinquellen wichtiger als ein spezielles Timing.</p></div><div class="card"><b>Sauna – nur optional</b><p class="small muted">Kein notwendiger Recovery-Schritt; die Leistungs- und Erholungsbelege sind begrenzt. Wenn du Sauna gewohnt bist und dich gesund fühlst, bleib bei einer kurzen, vertrauten Runde. Geh raus, wenn dir schwindelig, übel oder ungewöhnlich schwach wird. Auslassen bei Krankheit, Fieber oder Dehydrierung; bei Herz-/Blutdruckproblemen, Schwangerschaft oder relevanten Medikamenten vorher medizinisch nachfragen. Kein Alkohol und kein „Aushalten“ als Ziel.</p><button class="outline" data-rehab="sauna">${st.sauna?'Sauna notiert ✓':'Sauna optional notieren'}</button></div><div class="card"><b>Supplemente</b><p class="small muted">Für Sonntag ist kein zusätzlicher Supplement-Stack nötig. Nimm nichts Neues allein für „Recovery“; wenn du bereits ein Supplement nutzt, bleib bei deinem gewohnten Plan und lass Wechselwirkungen oder Erkrankungen fachlich prüfen. Keine Sonderdosis am Ruhetag.</p></div><section class="section"><h2>Mahlzeiten heute</h2>${mealPanel()}</section><section class="section"><h2>Schlaf & Tagesroutine</h2><div class="small muted" style="margin:0 4px 8px">Für Erwachsene sind mindestens 7 Stunden ein sinnvoller Ausgangspunkt; Schlafbedarf ist individuell. Halte die Schlafenszeit möglichst regelmäßig.</div>${routinePanel(true)}</section><details class="card"><summary style="font-weight:700">Quellen & Einordnung</summary><ul class="small muted"><li><a href="https://pubmed.ncbi.nlm.nih.gov/33144349/" target="_blank" rel="noopener">Schlaf und Athlet:innen: Expertenkonsens</a></li><li><a href="https://link.springer.com/article/10.1186/s12970-017-0177-8" target="_blank" rel="noopener">ISSN-Positionspapier: Protein und Training</a></li><li><a href="https://www.ausport.gov.au/clearinghouse/evidence/sports-performance-recovery" target="_blank" rel="noopener">Australian Institute of Sport: Recovery</a></li><li><a href="https://www.mayoclinicproceedings.org/article/s0025-6196(18)30275-1/fulltext" target="_blank" rel="noopener">Sauna: Review zu Evidenz und Sicherheit</a></li></ul></details><button class="outline" data-go="programm" style="width:100%">Zur Wochenübersicht</button></section>`}function training(){let di=Number.isInteger(S.selectedDay)?S.selectedDay:dow(),p=getPlan(di);if(p.key==='rehab')return rehabView(di);if(p.key==='rest')return `<section class="section"><div class="card"><span class="pill">${DAYS[di]}</span><div class="big" style="margin:12px 0">Ruhetag</div><p class="muted">Heute ist frei eingeplant. Eine fehlende Aufzeichnung ist nicht automatisch ein Ruhetag.</p><button class="outline" data-go="programm">Wochenübersicht</button></div></section>`;if(p.key==='long')return runView(p,di,true);if(p.key==='push'||p.key==='pull')return strengthView(p,di)+runView(p,di,false)+`<section class="section"><h2>CrossFit WOD</h2>${wodPanel()}</section>`;return strengthView(p,di)}
function todayAdvice(p){let yesterday=S.logs.filter(x=>x.date===dateAgo(1)),heavyYesterday=yesterday.some(x=>x.type==='strength'&&['squat','deadlift'].includes(x.key)),hardRunYesterday=yesterday.some(x=>x.type==='run'&&x.pace>0&&x.pace<paceToSec(S.pace)-40),runConflict=!!(heavyYesterday&&p.run==='quality'),legConflict=!!(hardRunYesterday&&p.legs);if(!runConflict&&!legConflict)return '';let text=runConflict?'Gestern waren schwere Beine erfasst; heute den Qualitätslauf locker machen.':'Gestern war ein harter Lauf erfasst; heute den Beintag leichter gestalten.';return `<div class="card"><b class="ember">Heute beachten</b><p class="small">${text}</p><button class="outline" data-advice-light>Leichtere Anpassung aktivieren</button></div>`}
function strengthView(p,di){let key=p.key,ex=EX[key],ms=mainSets();return `<section class="section"><div class="card"><div class="row start"><div><span class="pill">${DAYS[di]} · ${esc(p.name)}</span><h2 style="margin:10px 0 3px">${block()} · Woche ${S.week}</h2><div class="small muted">Ziel-RPE ${wk().rpe[wi()]} · Arbeitsgewicht aus Setup und Wochenfaktor</div></div><div class="big">${wk().rpe[wi()]}</div></div><div class="bar" style="margin-top:14px"><i style="width:${Object.keys(S.completed).filter(k=>k.startsWith(S.week+'-')&&S.completed[k]).length/6*100}%"></i></div></div>${readinessPanel(p)}${todayAdvice(p)}<div class="card"><details><summary style="font-weight:700;min-height:28px">Aufwärmen & Reihenfolge</summary><p class="small muted">Mobility und Aufwärmsätze zum Tagesfokus. Kombitag: wichtigere Einheit zuerst, wenn möglich sechs Stunden Abstand. ${p.run?'Bei Quality Run: Lauf-ABC und Steigerungen.':''}</p><p class="small">${ex.map((e,i)=>`${i+1}. ${e[0]}`).join(' → ')}</p></details></div><div class="card"><div class="row"><div><b>Geplante Einheit</b><div class="small muted">${ms[0]} × ${ms[1]} Hauptlift · ${auxSets()} Zusatzsätze</div></div><button class="primary" data-start="${di}">Session starten</button></div></div><div class="list">${ex.map((e,i)=>{let repl=S.swaps[e[0]]||e[0],baseKey=e[0]==='Back Squat'?'squat':e[0]==='Bankdrücken'?'bench':e[0]==='Overhead Press'?'ohp':e[0]==='Deadlift'?'deadlift':e[0]==='Beinpresse'?'legpress':key==='pull'&&i===1?'deadlift':key==='deadlift'&&i===1?'deadlift':'bench';let isMain=e[2]==='main';let w=isMain?round25(workWeight(baseKey)*((S.lighter&&p.legs)?0.9:1)):e[0]==='Beinpresse'?workWeight('legpress'):key==='pull'&&i===1?round25(workWeight('deadlift')*.5):key==='deadlift'&&i===1?round25(workWeight('deadlift')*.65):'—';let n=Math.max(1,(isMain?ms[0]:auxSets())-(S.lighter&&p.legs?1:0)),r=isMain?ms[1]:e[3];return `<div class="listrow"><div class="grow"><b>${esc(repl)}</b><div class="small muted">${esc(e[1])} · ${n} × ${r} · ${w==='—'?'Körpergewicht/Verlauf':w+' kg'}</div><div class="tiny muted">${(ALT[e[0]]||[]).length} Alternativen</div></div><button class="outline" data-swap="${esc(e[0])}" aria-label="Übung tauschen">⇄</button></div>`}).join('')}</div>${key==='upper'?triPanel():''}<div class="card"><div class="row"><span class="small muted">Wenn Beschwerden oder ungewöhnliche Symptome auftreten: abbrechen und abklären lassen.</span><button class="outline" data-move="${di}">Verschieben</button></div></div>${p.run?'':`<section class="section"><h2>CrossFit WOD</h2>${wodPanel()}</section>`}</section>`}
function readinessPanel(p){S.readiness=S.readiness||{};let r=S.readiness[today()]||{},sleepEntry=S.sleep.find(x=>x.date===today());if(!('sleep'in r)&&sleepEntry)r=Object.assign({},r,{sleep:sleepEntry.hours>=7?3:sleepEntry.hours>=6?2:1});let low=[r.sleep,r.legs,r.energy].filter(x=>x===1).length;return `<div class="card"><div class="row"><b>Tagesform</b><span class="small muted">Schlaf-Schnitt ${sleepAverage()}</span></div><div class="formgrid" style="margin-top:10px">${[['sleep','Schlaf'],['legs','Beine'],['energy','Energie']].map(([k,v])=>`<div><label>${v}</label><select data-ready="${k}"><option value="3" ${r[k]===3?'selected':''}>Gut</option><option value="2" ${r[k]===2?'selected':''}>Okay</option><option value="1" ${r[k]===1?'selected':''}>Schlecht</option></select></div>`).join('')}</div><div class="small ${low>=2?'ember':'muted'}" style="margin-top:8px">${low>=2?'Mehrere schlechte Werte – heute leichter zu trainieren.':'Bei mehreren schlechten Werten: Beintag −10 % Gewicht, ein Satz weniger; harter Lauf locker und 30 % kürzer.'}</div><button class="outline" data-easyday style="margin-top:9px">${S.lighter?'Leichter-Modus aus':'Heute leichter machen'}</button></div>`}
function sleepAverage(){let vals=S.sleep.filter(x=>x.date>=dateAgo(6)).map(x=>x.hours);return vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1)+' h':'—'}
function triPanel(){let suppressed=isDeload()||S.week===16,streak=S.tri?.streak||0,blocked=streak>=3&&S.tri.lastWeek===S.week-1,defaultGroup=blocked?(S.tri.lastMuscle==='shoulders'?'back':'shoulders'):(S.tri.lastMuscle||'shoulders');return `<div class="card"><div class="row"><b>6-12-25 Tri-Set</b><span class="pill">${streak} Wochen am Stück</span></div><div class="small muted">2 Runden · 6, 12, 25 Wiederholungen · 10–15 s zwischen den Sätzen, 3 min zwischen Runden. Oberkörper only. Kein zusätzlicher Trainingseintrag.</div>${blocked?'<p class="small ember">Drei Wochen erreicht: diese Woche pausieren oder die Muskelgruppe wechseln.</p>':''}<label style="margin-top:10px">Muskelgruppe</label><select id="triGroup"><option value="shoulders" ${defaultGroup==='shoulders'?'selected':''}>Schultern</option><option value="back" ${defaultGroup==='back'?'selected':''}>Rücken</option></select><div class="actions"><button class="primary" data-tri ${suppressed?'disabled':''}>${suppressed?'In Deload/Test ausgesetzt':'Tri-Set starten'}</button><button class="outline" data-tri-pause>Diese Woche pausieren</button></div></div>`}
function startTri(group){let streak=S.tri?.streak||0,wasLast=S.tri?.lastWeek===S.week-1,blocked=wasLast&&streak>=3;if(S.tri?.pausedWeek===S.week){toast('Tri-Set ist diese Woche pausiert.');return}if(blocked&&group===S.tri.lastMuscle){toast('Nach drei Wochen bitte pausieren oder Muskelgruppe wechseln.');return}let muscles={shoulders:[['Schulterdrücken',6,'shoulders',S.weights.ohp||0],['Seitheben',12,'shoulders',0],['Face Pulls',25,'shoulders',0]],back:[['Klimmzüge',6,'back',0],['Chest-Supported Row',12,'back',0],['Face Pulls',25,'back',0]]};let base=muscles[group]||muscles.shoulders;S.tri=S.tri||{sessions:[]};S.tri.active={group,idx:0,started:Date.now(),items:Array.from({length:2},(_,round)=>base.map(([name,reps,muscle,kg])=>({name,reps,muscle,round:round+1,kg,done:false}))).flat()};S.tab='training';save();render()}
function triRunView(){let a=S.tri.active,done=a.items.filter(x=>x.done).length,x=a.items[a.idx];return `<section class="section"><div class="row"><button class="outline" data-tri-exit>Abbrechen</button><span class="small muted">Optional · 6-12-25 · Runde ${x.round}/2</span><button class="outline" data-tri-finish>Abschließen</button></div><div class="session-head"><div class="row"><b>${x.name}</b><span class="meter">${a.idx+1}/6</span></div><div class="bar"><i style="width:${done/6*100}%"></i></div></div><div class="card"><span class="pill">${x.muscle} · Runde ${x.round}</span><div class="big" style="margin:12px 0">${x.reps}</div><div class="small muted">Wiederholungen · Gewicht frei wählen, nicht vorgegeben</div><label style="margin-top:12px">Gewicht (kg, optional)</label><input id="triWeight" type="number" min="0" step="0.5" value="${x.kg||''}"><button class="primary" data-tri-check style="margin-top:12px;width:100%">${x.done?'Als offen markieren':'Satz abhaken'}</button></div><div class="card"><div class="row"><b>Pause</b><span class="meter" id="timer">00:15</span></div><div class="actions"><button class="outline" data-tri-rest>Pause starten</button><button class="outline" data-tri-roundrest>3 min Rundenpause</button></div></div><div class="actions"><button class="outline" data-tri-prev>Zurück</button><button class="primary" data-tri-next>${a.idx===5?'Tri-Set abschließen':'Weiter'}</button></div></section>`}
